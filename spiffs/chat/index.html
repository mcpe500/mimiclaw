<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MimiClaw Chat</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f0f1a;color:#e0e0e0;display:flex;flex-direction:column;height:100vh}
.header{background:#1a1a2e;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a2a4a}
.header h1{font-size:16px;color:#e94560;font-weight:600}
.status-dot{width:10px;height:10px;border-radius:50%;background:#555;flex-shrink:0;transition:background .3s}
.status-dot.connected{background:#4ade80}
.status-dot.error{background:#ef4444}
.messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:80%;padding:10px 14px;border-radius:12px;word-wrap:break-word;font-size:14px;line-height:1.5}
.msg.user{align-self:flex-end;background:#e94560;color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#1e293b;color:#e0e0e0;border-bottom-left-radius:4px}
.input-bar{background:#1a1a2e;padding:12px 16px;display:flex;gap:10px;border-top:1px solid #2a2a4a}
.input-bar input{flex:1;background:#0f0f1a;border:1px solid #2a2a4a;color:#e0e0e0;padding:10px 14px;border-radius:8px;font-size:14px;outline:none}
.input-bar input:focus{border-color:#e94560}
.input-bar button{background:#e94560;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600}
.input-bar button:hover{background:#c73850}
.input-bar button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:600px){.msg{max-width:92%}.header h1{font-size:14px}}
</style>
</head>
<body>
<div class="header">
<div class="status-dot" id="statusDot"></div>
<h1>MimiClaw Chat</h1>
</div>
<div class="messages" id="messages"></div>
<div class="input-bar">
<input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off">
<button id="sendBtn" onclick="sendMessage()">Send</button>
</div>
<script>
const msgsEl=document.getElementById('messages');
const inputEl=document.getElementById('msgInput');
const sendBtn=document.getElementById('sendBtn');
const dot=document.getElementById('statusDot');
let ws=null;
let reconnectDelay=1000;

function getWsUrl(){
const loc=window.location;
const host=loc.hostname||'localhost';
return 'ws://'+host+':18789/';
}

function addMsg(text,cls){
const d=document.createElement('div');
d.className='msg '+cls;
d.textContent=text;
msgsEl.appendChild(d);
msgsEl.scrollTop=msgsEl.scrollHeight;
}

function setStatus(state){
dot.className='status-dot '+state;
sendBtn.disabled=(state!=='connected');
}

function connect(){
ws=new WebSocket(getWsUrl());
ws.onopen=()=>{
setStatus('connected');
reconnectDelay=1000;
addMsg('Connected to MimiClaw','bot');
};
ws.onclose=()=>{
setStatus('error');
addMsg('Disconnected. Reconnecting...','bot');
setTimeout(()=>{reconnectDelay=Math.min(reconnectDelay*2,30000);connect()},reconnectDelay);
};
ws.onerror=()=>{setStatus('error')};
ws.onmessage=(e)=>{
try{
const data=JSON.parse(e.data);
if(data.type==='response'&&data.content){
addMsg(data.content,'bot');
}
}catch(err){}
};
}

function sendMessage(){
const text=inputEl.value.trim();
if(!text||!ws||ws.readyState!==WebSocket.OPEN)return;
const msg={type:'message',content:text,chat_id:'web'};
ws.send(JSON.stringify(msg));
addMsg(text,'user');
inputEl.value='';
}

inputEl.addEventListener('keydown',(e)=>{
if(e.key==='Enter')sendMessage();
});

connect();
</script>
</body>
</html>
